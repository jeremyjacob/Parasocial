# Deploys to Fly.io (see fly.toml): Fly's remote builder builds deploy/fly.Dockerfile and rolls the
# single machine. A stopped (scaled-to-zero) machine is updated in place and stays stopped until the
# next request.
#
# Secrets: FLY_API_TOKEN (`fly tokens create deploy -a parasocial`).
# Rollback: "Run workflow" on an older commit/ref (workflow_dispatch), or `fly releases` +
# `fly deploy --image registry.fly.io/parasocial:<older deployment tag>`.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push supersedes a queued (not yet started) one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://parasocial.jjacob.dev
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://parasocial.jjacob.dev/signin || true)
            echo "HTTP $code"
            case "$code" in 2*|3*) exit 0 ;; esac
            sleep 10
          done
          exit 1
